# Keep the JVM heap modest: this project targets low-end developer machines and
# CI runners as well as low-end Android devices. The app itself has no heavy deps.
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
